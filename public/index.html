<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Lolo Store - Buy Dogs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 400px;
        }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        select, input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐶 Micro Lolo Store</h1>
        <div class="form-group">
            <label for="product">Select Your Dog</label>
            <select id="product">
                <!-- Options will be loaded from backend -->
            </select>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" value="1" min="1">
        </div>
        <button onclick="placeOrder()">Place Order</button>
        <div class="loader" id="loader">Processing...</div>
        <div id="result"></div>
    </div>

    <script>
        // Load products on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const productSelect = document.getElementById('product');
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                
                productSelect.innerHTML = products.map(p => `
                    <option value="${p.id}">${p.name} ($${p.price.toFixed(2)})</option>
                `).join('');
            } catch (err) {
                console.error('Failed to load products:', err);
                productSelect.innerHTML = '<option disabled>Error loading dogs</option>';
            }
        });

        async function placeOrder() {
            const productId = document.getElementById('product').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const resultDiv = document.getElementById('result');
            const loader = document.getElementById('loader');

            resultDiv.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity })
                });

                const data = await response.json();
                
                loader.style.display = 'none';
                resultDiv.style.display = 'block';

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <strong>Order Created!</strong><br>
                        ID: ${data.id}<br>
                        Status: ${data.status}<br>
                        Total: $${data.total_price.toFixed(2)}
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerText = data.error || 'Something went wrong';
                }
            } catch (err) {
                loader.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerText = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
